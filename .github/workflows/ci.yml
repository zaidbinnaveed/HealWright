name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # full suite (real Chromium) + smoke-10 benchmark
    env:
      # PR CI never calls a VLM; replay mode makes any accidental call an error.
      HEALWRIGHT_VLM_MODE: replay
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      # Browsers come from the project's own Playwright (the version locked in uv.lock),
      # so install them after uv sync. The cache key carries that exact version; system
      # libraries (--with-deps) are installed on every run, cache hit or not.
      - name: Read the locked Playwright version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium (incl. headless shell) and its system libraries
        run: uv run playwright install --with-deps chromium

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Unit and integration tests
        run: uv run pytest -m "unit or integration" -q --run-timing

      # Smoke-10 (all 8 classes, both trap types) on every PR, VLM in
      # replay mode (no keys, no calls). Fails on any false heal or harness error.
      - name: Benchmark smoke-10 (replay)
        run: uv run python -m benchmark.run --system healwright --smoke --vlm-mode replay --fail-on-false-heal

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-10-results
          path: benchmark/results/
