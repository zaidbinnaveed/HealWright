[project]
name = "healwright"
version = "0.1.0"
description = "Verified self-healing for Playwright selectors in Python tests: heals only when the repaired action has the same observable effect."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Muhammad Abbas" },
    { name = "Muhammad Sabeeh" },
    { name = "Zaid Bin Naveed" },
]
dependencies = [
    "fastapi>=0.162.0",
    "filelock>=4.2.9",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "libcst>=1.9.0",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "python-json-logger>=4.2.0",
    "python-ulid>=4.1.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "tenacity>=9.1.4",
    "uvicorn>=0.54.0",
]

[project.entry-points.pytest11]
healwright = "healwright.plugin"

[project.scripts]
healwright = "healwright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healwright"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "time-machine>=3.6.0",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# *.md: ruff >=0.17 formats Python code blocks in Markdown; the docs must never be rewritten.
extend-exclude = [".healwright", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PT", "N"]
ignore = [
    "E501",  # line length is enforced by the formatter
    "N818",  # exception names are part of the public contract, e.g. BaselineMissing
]

[tool.ruff.lint.isort]
known-first-party = ["healwright", "chaos_store", "benchmark", "examples", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "PT011"]

[tool.ruff.format]
line-ending = "lf"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src/healwright"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-ra --strict-markers -p pytester"
filterwarnings = [
    # Upstream: pytest-playwright's own session-scoped base_url fixture (not our code).
    "ignore:Session-scoped fixtures defined as instance methods are deprecated",
]
markers = [
    "unit: fast, in-process tests with no browser or network",
    "integration: in-process tests using TestClient, real Chromium or pytester",
    "e2e: end-to-end runs against the Chaos Store (smoke-10)",
    "live: calls real VLM providers; needs API keys; never in PR CI",
    "slow: timing or long-running tests",
    "timing: wall-clock assertions; deselected unless --run-timing",
    "release_gate: release-gate invariants 2 and 3 (minutes); deselected unless --run-release-gate",
]

[tool.coverage.run]
source = ["healwright"]
branch = true
